replicaCount: 1

image:
  repository: ghcr.io/hierynomus/rancher-storage-mcp
  tag: main
  pullPolicy: Always

# imagePullSecrets:
#   - name: ghcr-pull-secret

nameOverride: ""
fullnameOverride: ""

# Rancher Manager connection.
#
# Leave url, token and existingSecret ALL empty to run in per-request mode: no
# static credentials are baked in, and every tool call must carry R_url and
# R_token headers instead, so one deployment serves callers with different
# Rancher identities under their own RBAC. The Rancher AI assistant sends these
# headers itself.
rancher:
  # URL of the Rancher Manager instance. Required unless running in per-request mode.
  url: ""
  # API token with access to the target clusters. Required when url is set and
  # existingSecret is not.
  token: ""
  # Name of a pre-existing Secret with keys RANCHER_URL and RANCHER_TOKEN.
  # When set, rancher.url and rancher.token are ignored.
  existingSecret: ""
  # Set to "false" to skip TLS verification (useful for self-signed certs in dev/lab).
  tlsVerify: "true"

# Namespace Longhorn is installed into on the downstream clusters.
longhorn:
  namespace: longhorn-system

service:
  type: ClusterIP
  port: 3000
  # nodePort: 30300  # pin a specific NodePort (only used when type=NodePort)

ingress:
  enabled: false
  className: traefik
  host: rancher-storage-mcp.example.com
  tls:
    enabled: false
    secretName: ""
    certManager:
      enabled: false
      clusterIssuer: letsencrypt-prod

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 20m
    memory: 32Mi

# Extra environment variables passed verbatim to the container.
env:
  - name: RUST_LOG
    value: info

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
