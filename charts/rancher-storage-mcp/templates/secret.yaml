{{- if and .Values.rancher.url (not .Values.rancher.token) }}
{{- fail "rancher.token is required when rancher.url is set; leave both empty to require per-request R_url/R_token headers instead" }}
{{- end }}
{{- if and .Values.rancher.token (not .Values.rancher.url) }}
{{- fail "rancher.url is required when rancher.token is set; leave both empty to require per-request R_url/R_token headers instead" }}
{{- end }}
{{- if and (not .Values.rancher.existingSecret) .Values.rancher.url .Values.rancher.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rancher-storage-mcp.fullname" . }}-rancher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rancher-storage-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  RANCHER_URL: {{ .Values.rancher.url | quote }}
  RANCHER_TOKEN: {{ .Values.rancher.token | quote }}
{{- end }}
