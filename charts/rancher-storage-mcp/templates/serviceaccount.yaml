apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rancher-storage-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rancher-storage-mcp.labels" . | nindent 4 }}
# This server never calls its own cluster's API: every Longhorn request goes to
# a downstream cluster through Rancher's proxy, authenticated with the Rancher
# token. There is deliberately no Role or RoleBinding in this chart, and no
# reason to mount a ServiceAccount token.
automountServiceAccountToken: false
